<article class="card-container">
    <header class="card-container__header">
        @if(filmData.img) {
            <img [src]="filmData.img" alt="Karen Cardoso">
        } @else {
            <div class="card-container__header--icon">
                <mat-icon>movie</mat-icon>
            </div>
        }
        <time datetime="2025">{{ filmData.year }}</time>
    </header>
    <section class="card-container__content">
        <div>
            <h2>{{ filmData.name }}</h2>
            <p>{{ filmData.function }}</p>
        </div>

        <dl class="card-container__content-description">
            <div class="card-container__content-description--info">
                <mat-icon>movie</mat-icon>
                <div>
                    <dt>DIR. FOTOGRAFIA</dt>
                    <dd [title]="filmData.directorFotografy">{{ filmData.directorFotografy }}</dd>
                </div>

            </div>
            <div class="card-container__content-description--info">
                <mat-icon>person</mat-icon>
                <div>
                    <dt>DIREÇÃO</dt>
                    <dd [title]="filmData.director">{{ filmData.director }}</dd>
                </div>

            </div>
        </dl>
        <span>
            {{ filmData.type }}
        </span>
    </section>
</article>
