<main class="c-container">
    <h2>Karen Cardoso</h2>
    <h3>Camera Assistant</h3>

    <h1>Filmography</h1>
    <nav class="c-container__header">
        @for(item of types; track item.type) {
            <app-button-generic
                [label]="item.type"
                (click)="filterByType(item.type)">
            </app-button-generic>
        }
    </nav>
    <mat-grid-list [cols]="cols" rowHeight="350px" gutterSize="20px">
        @for(film of filteredFilms; track film.name) {
            <mat-grid-tile>
                <app-card-film [filmData]="film"></app-card-film>
            </mat-grid-tile>
        } @empty {
            <mat-grid-tile>
                <p>Nenhum filme encontrado.</p>
            </mat-grid-tile>
        }
    </mat-grid-list>
</main>
